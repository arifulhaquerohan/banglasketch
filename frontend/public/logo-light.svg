<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bangla Sketch – ইন্টেরিয়র ডিজাইন যার হাতেখড়ি">
  <defs>
    <radialGradient id="terracottaSunLight" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#F28B72"/>
      <stop offset="50%" stop-color="#E57358"/>
      <stop offset="100%" stop-color="#C55237"/>
    </radialGradient>
    <radialGradient id="lampGlowLight" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FFE8B3" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#FFD680" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFA834" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softShadowLight)">
    <!-- 1. Sun Disk -->
    <circle cx="362" cy="72" r="42" fill="url(#terracottaSunLight)"/>

    <!-- 2. Window -->
    <g transform="translate(152, 142)" stroke="#FAF7F2" stroke-width="2.4" fill="none" opacity="0.95">
      <rect x="0" y="0" width="38" height="38" rx="2" stroke-width="3"/>
      <line x1="19" y1="0" x2="19" y2="38"/>
      <line x1="0" y1="19" x2="38" y2="19"/>
    </g>

    <!-- 3. Pendant Lamp -->
    <g transform="translate(232, 68)">
      <line x1="0" y1="0" x2="0" y2="78" stroke="#FAF7F2" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M -16 88 C -16 77, 16 77, 16 88 Z" fill="#FAF7F2"/>
      <line x1="-18" y1="89" x2="18" y2="89" stroke="#E57358" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="91" r="2.5" fill="#FFE8B3"/>
      <polygon points="0,91 -30,175 30,175" fill="url(#lampGlowLight)"/>
    </g>

    <!-- 4. Lounge Armchair -->
    <g transform="translate(198, 180)" fill="#FAF7F2">
      <path d="M 0 10 C -2 -14, 26 -22, 38 -10 C 44 -4, 42 12, 32 20 C 22 25, 6 22, 0 10 Z" fill="#FAF7F2"/>
      <path d="M -2 12 C 6 6, 26 8, 30 18 C 30 24, 18 27, 0 25 Z" fill="#E57358" opacity="0.95"/>
      <line x1="6" y1="23" x2="-2" y2="48" stroke="#FAF7F2" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="14" y2="48" stroke="#FAF7F2" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="28" y1="22" x2="36" y2="48" stroke="#FAF7F2" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- 5. Plant -->
    <g transform="translate(296, 186)">
      <path d="M -8 24 L 8 24 L 6 42 L -6 42 Z" fill="#FAF7F2"/>
      <line x1="-9" y1="24" x2="9" y2="24" stroke="#E57358" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 0 24 Q -2 4, 0 -8 Q 4 4, 0 24" fill="#FAF7F2"/>
      <path d="M 0 18 Q -16 8, -18 -4 Q -8 2, 0 18" fill="#FAF7F2"/>
      <path d="M 0 16 Q 14 6, 18 -6 Q 8 2, 0 16" fill="#FAF7F2"/>
      <path d="M 0 10 Q 8 -2, 10 -12 Q 2 -2, 0 10" fill="#E57358" opacity="0.95"/>
    </g>

    <!-- 6. Roof & Silhouette -->
    <path d="M 115 198 C 128 160, 222 74, 256 66 C 290 74, 384 160, 397 198" fill="none" stroke="#FAF7F2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 248 69 L 256 56 L 264 69" fill="none" stroke="#FAF7F2" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 324 102 L 324 74 L 340 74 L 340 118" fill="none" stroke="#FAF7F2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="124" y1="190" x2="124" y2="242" stroke="#FAF7F2" stroke-width="10" stroke-linecap="round"/>
    <line x1="388" y1="190" x2="388" y2="242" stroke="#FAF7F2" stroke-width="10" stroke-linecap="round"/>
    <path d="M 105 244 C 160 242, 352 242, 407 244" stroke="#FAF7F2" stroke-width="8" stroke-linecap="round"/>
    <line x1="138" y1="244" x2="158" y2="226" stroke="#FAF7F2" stroke-width="1.8" opacity="0.45"/>
    <line x1="374" y1="244" x2="354" y2="226" stroke="#FAF7F2" stroke-width="1.8" opacity="0.45"/>
  </g>

  <!-- Typography Lockup -->
  <g id="brandTypographyLight">
    <text x="256" y="326" text-anchor="middle">
      <tspan font-family="'Playfair Display', 'Cinzel', Georgia, 'Times New Roman', serif" font-weight="900" font-size="54" letter-spacing="1.5" fill="#FAF7F2">bangla</tspan>
      <tspan dx="12" font-family="'Manrope', 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="6" fill="#E57358">sketch</tspan>
    </text>
    <line x1="86" y1="362" x2="426" y2="362" stroke="#E57358" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>
    <circle cx="256" cy="362" r="3.5" fill="#E57358"/>
    <circle cx="86" cy="362" r="2.5" fill="#E57358"/>
    <circle cx="426" cy="362" r="2.5" fill="#E57358"/>
    <text x="256" y="412" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'SolaimanLipi', 'Kalpurush', sans-serif" font-size="25" font-weight="700" letter-spacing="0.5" fill="#FAF7F2">
      ইন্টেরিয়র ডিজাইন যার হাতেখড়ি
    </text>
    <text x="256" y="450" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="600" font-size="11.5" letter-spacing="7" fill="#BEC6AD">
      ARCHITECTURAL STUDIO • DHAKA
    </text>
  </g>
</svg>
