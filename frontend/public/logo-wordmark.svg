<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bangla Sketch – ইন্টেরিয়র ডিজাইন যার হাতেখড়ি">
  <defs>
    <!-- Terracotta / Warm Rust Sunset Gradient for the Sun Disk -->
    <radialGradient id="terracottaSunWm" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#E57358"/>
      <stop offset="50%" stop-color="#D05A3F"/>
      <stop offset="100%" stop-color="#B24329"/>
    </radialGradient>

    <!-- Warm Golden Light Glow from Pendant Lamp -->
    <radialGradient id="lampGlowWm" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FFE8B3" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#FFD680" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFA834" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadowWm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Artistic Architectural Graphic Mark -->
  <g transform="translate(150, 160) scale(0.92) translate(-256, -155)" filter="url(#softShadowWm)">
    <!-- 1. Terracotta Sun Disk (Outside the house in upper sky) -->
    <circle cx="362" cy="72" r="42" fill="url(#terracottaSunWm)"/>

    <!-- 2. Minimalist 4-Pane Window (Inside house) -->
    <g transform="translate(152, 142)" stroke="#222524" stroke-width="2.2" fill="none" opacity="0.9">
      <rect x="0" y="0" width="38" height="38" rx="2" stroke-width="2.8"/>
      <line x1="19" y1="0" x2="19" y2="38"/>
      <line x1="0" y1="19" x2="38" y2="19"/>
    </g>

    <!-- 3. Hanging Pendant Lamp -->
    <g transform="translate(232, 68)">
      <line x1="0" y1="0" x2="0" y2="78" stroke="#222524" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -16 88 C -16 77, 16 77, 16 88 Z" fill="#222524"/>
      <line x1="-18" y1="89" x2="18" y2="89" stroke="#D05A3F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="91" r="2.5" fill="#FFE8B3"/>
      <polygon points="0,91 -30,175 30,175" fill="url(#lampGlowWm)"/>
    </g>

    <!-- 4. Modern Lounge Chair -->
    <g transform="translate(198, 180)" fill="#222524">
      <path d="M 0 10 C -2 -14, 26 -22, 38 -10 C 44 -4, 42 12, 32 20 C 22 25, 6 22, 0 10 Z" fill="#222524"/>
      <path d="M -2 12 C 6 6, 26 8, 30 18 C 30 24, 18 27, 0 25 Z" fill="#D05A3F" opacity="0.92"/>
      <line x1="6" y1="23" x2="-2" y2="48" stroke="#222524" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="14" y2="48" stroke="#222524" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="28" y1="22" x2="36" y2="48" stroke="#222524" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- 5. Potted Botanical Plant -->
    <g transform="translate(296, 186)">
      <path d="M -8 24 L 8 24 L 6 42 L -6 42 Z" fill="#222524"/>
      <line x1="-9" y1="24" x2="9" y2="24" stroke="#D05A3F" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 24 Q -2 4, 0 -8 Q 4 4, 0 24" fill="#222524"/>
      <path d="M 0 18 Q -16 8, -18 -4 Q -8 2, 0 18" fill="#222524"/>
      <path d="M 0 16 Q 14 6, 18 -6 Q 8 2, 0 16" fill="#222524"/>
      <path d="M 0 10 Q 8 -2, 10 -12 Q 2 -2, 0 10" fill="#D05A3F" opacity="0.95"/>
    </g>

    <!-- 6. Architectural Gable Pitch Roof & Frame -->
    <path d="M 115 198 C 128 160, 222 74, 256 66 C 290 74, 384 160, 397 198" fill="none" stroke="#222524" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 248 69 L 256 56 L 264 69" fill="none" stroke="#222524" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 324 102 L 324 74 L 340 74 L 340 118" fill="none" stroke="#222524" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="124" y1="190" x2="124" y2="242" stroke="#222524" stroke-width="10" stroke-linecap="round"/>
    <line x1="388" y1="190" x2="388" y2="242" stroke="#222524" stroke-width="10" stroke-linecap="round"/>
    <path d="M 105 244 C 160 242, 352 242, 407 244" stroke="#222524" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right Typography Wordmark Group (Starting at x=340) -->
  <g transform="translate(340, 0)">
    <!-- Primary Brand Name: "bangla" (Bold black serif) + "sketch" (Terracotta spaced) -->
    <text x="0" y="142" font-family="'Playfair Display', 'Cinzel', Georgia, 'Times New Roman', serif" font-weight="900" font-size="94" letter-spacing="1.5" fill="#222524">
      bangla
    </text>

    <text x="368" y="142" font-family="'Manrope', 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46" letter-spacing="10" fill="#D05A3F">
      sketch
    </text>

    <!-- Fine Architectural Divider Line -->
    <line x1="2" y1="184" x2="820" y2="184" stroke="#D05A3F" stroke-width="2.5" opacity="0.85"/>
    <circle cx="2" cy="184" r="3.5" fill="#D05A3F"/>
    <circle cx="820" cy="184" r="3.5" fill="#D05A3F"/>

    <!-- Subtitle: Bengali Brand Name + Tagline -->
    <text x="4" y="244" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'SolaimanLipi', 'Kalpurush', sans-serif" font-size="36" font-weight="700" fill="#222524">
      বাংলা স্কেচ
    </text>

    <text x="820" y="244" text-anchor="end" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'SolaimanLipi', 'Kalpurush', sans-serif" font-weight="600" font-size="30" letter-spacing="0.5" fill="#D05A3F">
      ইন্টেরিয়র ডিজাইন যার হাতেখড়ি
    </text>
  </g>
</svg>
