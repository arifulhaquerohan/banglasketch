name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Django REST Framework Backend CI
  # --------------------------------------------------------------------------
  backend-ci:
    name: Django Backend Tests & Audits
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banglasketch_test_db
          POSTGRES_USER: banglasketch_user
          POSTGRES_PASSWORD: test_secure_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: "ci-test-django-secret-key-32-chars-long"
      ADMIN_JWT_SECRET: "ci-test-admin-jwt-secret-key-32-bytes"
      TOTP_ENCRYPTION_KEY: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
      DATABASE_URL: "postgresql://banglasketch_user:test_secure_password_123@127.0.0.1:5432/banglasketch_test_db"
      DB_SSL_MODE: "disable"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      FRONTEND_URL: "http://localhost:3000"
      PYTHON_DOTENV_DISABLED: "1"
      NODE_ENV: "development"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "django_backend/requirements.txt"

      - name: Install System Dependencies (WeasyPrint & Rendering Engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu-core \
            fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r django_backend/requirements.txt

      - name: Run Django System Checks
        run: |
          cd django_backend
          python manage.py check

      - name: Apply Database Migrations
        run: |
          cd django_backend
          python manage.py migrate

      - name: Run Backend Test Suite
        run: |
          cd django_backend
          python manage.py test --keepdb --verbosity=2 tests.test_api tests.test_auth_security tests.test_chatbot tests.test_client_handling tests.test_database_integrity tests.test_email_jobs tests.test_invoices tests.test_media_upload

  # --------------------------------------------------------------------------
  # Next.js Frontend CI
  # --------------------------------------------------------------------------
  frontend-ci:
    name: Next.js Frontend Build & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Unit & Regression Tests
        run: npm test

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:5000"
        run: npm run build
